<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="stage">
    <header class="brand">
      <h1>Snake</h1>
      <p>Eat, grow, don't crash.</p>
    </header>

    <section class="hud" aria-live="polite">
      <div class="stat">
        <span class="label">Score</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">Best</span>
        <span id="best" class="value">0</span>
      </div>
    </section>

    <div class="board-wrap">
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-title" class="overlay-title">Ready?</p>
        <p id="overlay-text" class="overlay-text">Press Play, then steer with arrows</p>
        <button id="start-btn" type="button">Play</button>
      </div>
    </div>

    <section class="controls" aria-label="Touch controls">
      <button type="button" data-dir="up" aria-label="Move up">▲</button>
      <div class="controls-mid">
        <button type="button" data-dir="left" aria-label="Move left">◀</button>
        <button type="button" data-dir="down" aria-label="Move down">▼</button>
        <button type="button" data-dir="right" aria-label="Move right">▶</button>
      </div>
    </section>

    <p class="hint">Arrow keys or WASD · Space to pause</p>
  </main>

  <script src="script.js?v=3"></script>
</body>
</html>
