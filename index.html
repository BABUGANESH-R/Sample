<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHIFT — Sliding Puzzle</title>
  <meta name="description" content="SHIFT — a crisp sliding-tile puzzle. Shuffle, slide, solve." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="app">
    <!-- Start screen -->
    <section id="start-screen" class="screen screen--start" aria-label="Welcome">
      <div class="hero">
        <p class="brand">SHIFT</p>
        <h1 class="hero__headline">Slide the tiles. Find the order.</h1>
        <p class="hero__lede">A classic sliding puzzle with clean moves, sharp timing, and just enough stubbornness.</p>
        <div class="hero__actions">
          <button type="button" class="btn btn--primary" id="btn-play" data-size="4">Play 4×4</button>
          <button type="button" class="btn btn--ghost" id="btn-play-easy" data-size="3">3×3</button>
          <button type="button" class="btn btn--ghost" id="btn-play-hard" data-size="5">5×5</button>
        </div>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <div class="mosaic">
          <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span>
          <span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span>
          <span style="--i:6"></span><span style="--i:7"></span><span style="--i:8"></span>
        </div>
      </div>
    </section>

    <!-- Game screen -->
    <section id="game-screen" class="screen screen--game" hidden aria-label="Puzzle">
      <header class="game-bar">
        <button type="button" class="brand brand--link" id="btn-home" aria-label="Back to start">SHIFT</button>
        <div class="stats" role="status" aria-live="polite">
          <div class="stat">
            <span class="stat__label">Moves</span>
            <span class="stat__value" id="move-count">0</span>
          </div>
          <div class="stat">
            <span class="stat__label">Time</span>
            <span class="stat__value" id="timer">0:00</span>
          </div>
          <div class="stat">
            <span class="stat__label">Best</span>
            <span class="stat__value" id="best-score">—</span>
          </div>
        </div>
      </header>

      <div class="board-wrap">
        <div
          id="board"
          class="board"
          role="grid"
          aria-label="Puzzle board"
          tabindex="0"
        ></div>
      </div>

      <footer class="game-controls">
        <button type="button" class="btn btn--ghost" id="btn-shuffle">Shuffle</button>
        <button type="button" class="btn btn--ghost" id="btn-hint" title="Highlight a useful move">Hint</button>
        <div class="size-toggle" role="group" aria-label="Board size">
          <button type="button" class="chip" data-resize="3" aria-pressed="false">3×3</button>
          <button type="button" class="chip" data-resize="4" aria-pressed="true">4×4</button>
          <button type="button" class="chip" data-resize="5" aria-pressed="false">5×5</button>
        </div>
      </footer>
    </section>

    <!-- Win overlay -->
    <div id="win-overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="overlay__panel">
        <p class="overlay__eyebrow">Solved</p>
        <h2 id="win-title" class="overlay__title">Nice shift.</h2>
        <p class="overlay__body" id="win-summary">You cleared the board.</p>
        <div class="overlay__actions">
          <button type="button" class="btn btn--primary" id="btn-again">Play again</button>
          <button type="button" class="btn btn--ghost" id="btn-win-home">Home</button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
