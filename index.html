<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 class="brand">Chess</h1>
      <p class="tagline">Two players. One board. Your move.</p>
    </header>

    <main class="game">
      <div class="status-bar">
        <p id="status" class="status">White to move</p>
        <button id="reset" type="button" class="reset-btn">New game</button>
      </div>

      <div id="board" class="board" aria-label="Chess board" role="grid"></div>

      <aside class="captured">
        <div>
          <span class="captured-label">White took</span>
          <div id="captured-black" class="captured-pieces"></div>
        </div>
        <div>
          <span class="captured-label">Black took</span>
          <div id="captured-white" class="captured-pieces"></div>
        </div>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
